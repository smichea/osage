[package]
name = "osage-kart-native"
description = "Native client of the osage kart world (Bevy): the testbed of the rendering programme (design/03), online play and benchmark"
license = "MIT OR Apache-2.0"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "kart-native"
path = "src/main.rs"

[dependencies]
osage-kart-physics.workspace = true
osage-render.workspace = true
osage-sdk.workspace = true
osage-world-kart.workspace = true
anyhow.workspace = true
bevy = { workspace = true, features = ["3d", "ui"] }
crossbeam-channel.workspace = true
serde_json.workspace = true
tokio.workspace = true
