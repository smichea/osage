[package]
name = "osage-kart-native"
description = "Native client of the osage kart world (Bevy): the testbed of the rendering programme (design/03), online play and benchmark"
license = "MIT OR Apache-2.0"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "kart-native"
path = "src/main.rs"

[dependencies]
osage-kart-physics.workspace = true
osage-kart-racecraft.workspace = true
osage-kart-items.workspace = true
osage-kart-sound = { workspace = true, optional = true }
lewton = { workspace = true, optional = true }
osage-kart-land.workspace = true
osage-kart-roadside.workspace = true
osage-kart-model.workspace = true
osage-kart-crowd.workspace = true
osage-render.workspace = true
osage-procedural.workspace = true
osage-content.workspace = true
osage-props.workspace = true
osage-sdk.workspace = true
osage-kart-profile.workspace = true
osage-report.workspace = true
# The adapter, asked before the game starts (D-075): the version Bevy uses.
wgpu = { version = "30.0.1", default-features = false }
osage-world-kart.workspace = true
osage-kart-tracks.workspace = true
osage-kart-cup.workspace = true
osage-music.workspace = true
osage-voice.workspace = true
anyhow.workspace = true
bevy = { workspace = true, features = ["3d", "ui"] }
crossbeam-channel.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
default = ["sound"]
# The karts heard (osage-kart-sound): needs the system's sound library (ALSA
# on Linux). The bench is built without it: it measures pictures.
sound = ["bevy/audio", "dep:osage-kart-sound", "dep:lewton", "osage-music/bevy", "osage-voice/bevy", "osage-voice/device"]
