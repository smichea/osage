// Component types of the osage kart world. The world announces them, with
// these descriptions, in its Welcome: clients and AI agents need nothing else.

syntax = "proto3";

package kart.v1;

// kart.controls/1 — intent from a human driver: one physics step (1/60 s) of
// driving, with the few steps before it in case a datagram was lost.
message Controls {
  // Oldest first; the last one is the newest.
  repeated Step steps = 1;
}

message Step {
  // Counts the driver's steps from 1.
  uint64 sequence = 1;
  // 1 full throttle, -1 brake then reverse.
  float throttle = 2;
  // 1 full right, -1 full left.
  float steer = 3;
  // The drift button is held: steer and hold it at speed to drift; release
  // for a mini-turbo of one to three levels, by how long the drift lasted.
  // Pressed in the air, it is a trick: a boost on landing.
  bool drift = 4;
  // The use button is held (kart.paddock/1): a tyre, a stack, a cone or oil
  // goes behind the kart as it goes down — a shield — and is thrown or
  // dropped as it comes up; anything else is used as it goes down.
  bool use_item = 5;
  // A call about the race (kart.race/1): the host starts the next one; a
  // driver racing alone ends the race.
  RaceCall call = 6;
}

enum RaceCall {
  RACE_CALL_NONE = 0;
  // From the host, while the karts wait on the grid (PHASE_READY).
  RACE_CALL_START = 1;
  // From a driver who races alone (no other human or agent), while racing.
  RACE_CALL_STOP = 2;
}

// kart.autopilot/1 — intent for AI agents: how the world's autopilot drives
// your kart. Your kart waits on the grid until you send one.
message Autopilot {
  // 0 stopped … 1 flat out.
  float pace = 1;
  // Where on the road: -1 left edge, 0 centre, 1 right edge.
  float line = 2;
  // Drift through bends for mini-turbos: faster, riskier.
  bool drift = 3;
  // Use what the kart picks up as the world's own drivers do: a nitro on a
  // straight, a tyre at a kart ahead, a cone or oil for one close behind.
  bool use_items = 4;
}

// kart.state/1 — a kart's physics state, sent every step.
message KartState {
  float x = 1;
  float z = 2;
  float heading = 3;
  float speed = 4;
  float slide = 5;
  float drift = 6;
  float charge = 7;
  float boost = 8;
  // The last Step.sequence the server applied to this kart: a predicting
  // client replays its later steps from this state.
  uint64 applied = 9;
  // Rate of turn a knock gave, rad/s, positive to the left (D-045). Added
  // to kart.state/1: a reader that ignores it predicts without it.
  float spin = 10;
  // Seconds of rocket left (a paddock object): faster than a boost. Added
  // to kart.state/1: a reader that ignores it predicts a rocket as a plain
  // kart, and is corrected.
  float rocket = 11;
  // Added to kart.state/1 with jumps, tricks, starts and slipstreams
  // (D-050); a reader that ignores them predicts a flat track and is
  // corrected. Height above the road, m, and speed upwards, m/s.
  float height = 12;
  float climb = 13;
  // 1 once a trick was done in this jump: a boost on landing.
  float trick = 14;
  // Seconds the engine is stalled for, after a start too early.
  float stall = 15;
  // Seconds in another kart's wake so far: enough of it gives a boost.
  float draft = 16;
  // 1 when the drift button was held at the last step applied: a trick
  // needs a press.
  float held = 17;
}

// kart.racer/1 — who drives a kart and how their race goes.
message Racer {
  string name = 1;
  uint32 color = 2;
  bool bot = 3;
  // 0 on the grid, 1 on the first lap … laps + 1 once finished.
  uint32 lap = 4;
  // 1 = leading.
  uint32 position = 5;
  // Race time at the finish line, milliseconds; 0 while racing.
  uint64 finish_ms = 6;
  // What the kart holds, from a crate (kart.paddock/1).
  Item held = 7;
  // The colour of the smoke the kart pours (0xRRGGBB), while it pours
  // some (a smoke canister); 0 otherwise.
  uint32 smoke = 8;
  // Added with D-052. How many of what it holds the kart has left: up to
  // three for a stack of tyres.
  uint32 held_count = 9;
  // It holds its item behind it: a shield against a tyre from behind.
  bool trailing = 10;
  // Seconds nothing on the track touches it for (a pit-crew push).
  float guard = 11;
}

enum Item {
  ITEM_NONE = 0;
  // A long boost.
  ITEM_NITRO = 1;
  // Thrown ahead: it rolls, bounces off the barriers and spins the first
  // kart it meets.
  ITEM_TYRE = 2;
  // Dropped behind: slows and knocks the kart that hits it.
  ITEM_CONE = 3;
  // A patch left behind: a kart that drives into it spins.
  ITEM_OIL = 4;
  // A rocket behind the seat: faster than a nitro, and longer.
  ITEM_ROCKET = 5;
  // A canister that pours coloured smoke behind the kart: a screen.
  ITEM_SMOKE = 6;
  // Added with D-052. Three tyres, thrown one press each.
  ITEM_STACK = 7;
  // Flies over the track to the leader and comes down on it.
  ITEM_DRONE = 8;
  // An air bag that knocks every kart within a few metres aside.
  ITEM_BUMPER = 9;
  // A pit-crew push: a boost, and for a while nothing on the track touches
  // the kart.
  ITEM_PUSH = 10;
}

// kart.paddock/1 — crates to pick items from, and what karts left on the
// track. Sent when it changes: every step while a tyre rolls.
message Paddock {
  repeated Crate crates = 1;
  repeated Thing things = 2;
}

message Crate {
  float x = 1;
  float z = 2;
  // Broken, it is back in a few seconds.
  bool standing = 3;
}

message Thing {
  Item kind = 1;
  float x = 2;
  float z = 3;
  // Velocity, m/s: a tyre rolls.
  float vx = 4;
  float vz = 5;
  // Seconds before it goes.
  float life = 6;
  // Height above the road, m: a drone flies (D-052).
  float height = 7;
}

// kart.track/1 — the circuit: centre line, road and walls.
message Track {
  // x0, z0, x1, z1, …: a closed loop, metres.
  repeated float points = 1;
  float half_width = 2;
  // Grass between the road and the walls, metres.
  float verge = 3;
  // Distance along the centre line where the start/finish line is.
  float start = 4;
  // Sectors a lap is cut into; a lap counts only through all of them, in order.
  uint32 sectors = 5;
  // Crests across the road, verges and barriers (D-051): taken fast, a kart
  // leaves the road near the top and lands further on.
  repeated Crest crests = 6;
}

message Crest {
  // Where it starts, metres along the centre line. Over `rise` metres the
  // ground rises to `height`, then over `fall` metres it comes down again,
  // each way half a cosine.
  float along = 1;
  float rise = 2;
  float height = 3;
  float fall = 4;
}

// kart.race/1 — the race in progress.
message Race {
  Phase phase = 1;
  // Server time (microseconds since the Unix epoch) when the phase ends;
  // 0 if it has no set end.
  uint64 phase_ends_us = 2;
  uint32 laps = 3;
  // Server time of the start, once racing.
  uint64 started_us = 4;
  // Kart entities in race order.
  repeated uint64 order = 5;
  // The kart of the host: the first human driver still here, who starts
  // each race (RACE_CALL_START); 0 when the world starts races by itself.
  uint64 host = 6;
}

// kart.records/1 — the world's records on this track (D-053): the best
// laps and the best races of the world's number of laps, one per driver
// name, fastest first. Kept by the world across restarts.
message Records {
  string track = 1;
  repeated Record laps = 2;
  repeated Record races = 3;
  // The laps of the races the race board keeps.
  uint32 race_laps = 4;
}

message Record {
  string name = 1;
  uint32 ms = 2;
  // When, seconds since the Unix epoch.
  uint64 at = 3;
  // The kart and the driver character, empty until there is a choice.
  string kart = 4;
  string driver = 5;
  // Set in the race just run (or running): show it as new.
  bool fresh = 6;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  // No driver connected.
  PHASE_WAITING = 1;
  // Lights: karts on the grid, frozen.
  PHASE_COUNTDOWN = 2;
  PHASE_RACING = 3;
  // Results; the next race follows.
  PHASE_FINISHED = 4;
  // Karts on the grid, frozen, until the host starts the race: time for
  // others to join.
  PHASE_READY = 5;
}
