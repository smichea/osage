// Component types of the osage kart world. The world announces them, with
// these descriptions, in its Welcome: clients and AI agents need nothing else.

syntax = "proto3";

package kart.v1;

// kart.controls/1 — intent from a human driver: one physics step (1/60 s) of
// driving, with the few steps before it in case a datagram was lost.
message Controls {
  // Oldest first; the last one is the newest.
  repeated Step steps = 1;
}

message Step {
  // Counts the driver's steps from 1.
  uint64 sequence = 1;
  // 1 full throttle, -1 brake then reverse.
  float throttle = 2;
  // 1 full right, -1 full left.
  float steer = 3;
  // The drift button is held: steer and hold it at speed to drift; release
  // for a mini-turbo of one to three levels, by how long the drift lasted.
  // Pressed in the air, it is a trick: a boost on landing.
  bool drift = 4;
  // The use button is held (kart.paddock/1): a tyre, a stack, a cone or oil
  // goes behind the kart as it goes down — a shield — and is thrown or
  // dropped as it comes up; anything else is used as it goes down.
  bool use_item = 5;
  // A call about the race (kart.race/1): the host starts the next one; a
  // driver racing alone ends the race.
  RaceCall call = 6;
}

enum RaceCall {
  RACE_CALL_NONE = 0;
  // From the host, while the karts wait on the grid (PHASE_READY).
  RACE_CALL_START = 1;
  // From a driver who races alone (no other human or agent), while racing.
  RACE_CALL_STOP = 2;
}

// kart.autopilot/1 — intent for AI agents: how the world's autopilot drives
// your kart. Your kart waits on the grid until you send one.
message Autopilot {
  // 0 stopped … 1 flat out.
  float pace = 1;
  // Where on the road: -1 left edge, 0 centre, 1 right edge.
  float line = 2;
  // Drift through bends for mini-turbos: faster, riskier.
  bool drift = 3;
  // Use what the kart picks up as the world's own drivers do: a nitro on a
  // straight, a tyre at a kart ahead, a cone or oil for one close behind.
  bool use_items = 4;
}

// kart.state/1 — a kart's physics state, sent every step.
message KartState {
  float x = 1;
  float z = 2;
  float heading = 3;
  float speed = 4;
  float slide = 5;
  float drift = 6;
  float charge = 7;
  float boost = 8;
  // The last Step.sequence the server applied to this kart: a predicting
  // client replays its later steps from this state.
  uint64 applied = 9;
  // Rate of turn a knock gave, rad/s, positive to the left (D-045). Added
  // to kart.state/1: a reader that ignores it predicts without it.
  float spin = 10;
  // Seconds of rocket left (a paddock object): faster than a boost. Added
  // to kart.state/1: a reader that ignores it predicts a rocket as a plain
  // kart, and is corrected.
  float rocket = 11;
  // Added to kart.state/1 with jumps, tricks, starts and slipstreams
  // (D-050); a reader that ignores them predicts a flat track and is
  // corrected. Height above the road, m, and speed upwards, m/s.
  float height = 12;
  float climb = 13;
  // 1 once a trick was done in this jump: a boost on landing.
  float trick = 14;
  // Seconds the engine is stalled for, after a start too early.
  float stall = 15;
  // Seconds in another kart's wake so far: enough of it gives a boost.
  float draft = 16;
  // 1 when the drift button was held at the last step applied: a trick
  // needs a press.
  float held = 17;
  // Added with D-072. Seconds the tyres stay oily: they grip almost
  // nothing, the wheel barely turns the kart.
  float slick = 18;
  // Added with D-076. The controls of the last step the world applied to
  // the kart (the drift button is `held`): a client steps the karts near
  // its own on with them, to where they are when its predicted kart is.
  float throttle = 19;
  float steer = 20;
}

// kart.racer/1 — who drives a kart and how their race goes.
message Racer {
  string name = 1;
  uint32 color = 2;
  bool bot = 3;
  // 0 on the grid, 1 on the first lap … laps + 1 once finished.
  uint32 lap = 4;
  // 1 = leading.
  uint32 position = 5;
  // Race time at the finish line, milliseconds; 0 while racing.
  uint64 finish_ms = 6;
  // What the kart holds, from a crate (kart.paddock/1).
  Item held = 7;
  // The colour of the smoke the kart pours (0xRRGGBB), while it pours
  // some (a smoke canister); 0 otherwise.
  uint32 smoke = 8;
  // Added with D-052. How many of what it holds the kart has left: up to
  // three for a stack of tyres.
  uint32 held_count = 9;
  // It holds its item behind it: a shield against a tyre from behind.
  bool trailing = 10;
  // Seconds nothing on the track touches it for (a pit-crew push).
  float guard = 11;
  // Added with D-055. Who is at the wheel and in what (kart.roster/1's ids),
  // and the build they give the kart: a client predicting its own kart
  // steps it with this build.
  string driver = 12;
  string kart = 13;
  Build build = 14;
  // Added with D-062. A ghost: a run kept from an earlier time trial,
  // driven again by the world. `name` is who drove it; nothing touches it.
  bool ghost = 15;
  // Added with D-065. In a battle: the hits the kart can still take (3 at
  // the start), and whether it is out — it coasts, nothing touches it.
  uint32 lives = 16;
  bool out = 17;
}

// How a kart is built (D-055): top speed, acceleration, handling, grip and
// weight as shares of the standard kart's (1). Absent: the standard kart.
message Build {
  float top = 1;
  float accel = 2;
  float handling = 3;
  float grip = 4;
  float weight = 5;
}

// kart.choice/1 — intent for your own kart (humans and agents alike): the
// driver and the kart body to race with, by kart.roster/1's ids. On the grid
// it changes the kart at once; during a race, from the next one. Kept for
// the races that follow. An unknown id keeps what you had.
message Choice {
  string driver = 1;
  string kart = 2;
  // What to race next (D-057), from Race.events: the host's choice is
  // raced, the others' are votes. Empty: no change.
  string event = 3;
  // Added with D-064. The kart's paint (Racer.color): 0 the driver's own
  // colour, N the palette's colour N-1 (0-7 the team colours, 8-11 the
  // special ones players win in cups); unset, no change. A paint is how a
  // kart looks, never how it drives.
  optional uint32 paint = 4;
  // Added with D-088. How the bots race: "easy", "normal" or "hard"; the
  // host's choice is raced from the next race. Empty: no change.
  string bots = 5;
  // Added with D-089. The engine class, cc: 50, 100, 150 or 200; the
  // host's choice is raced from the next race. 0: no change.
  uint32 class = 6;
}

// kart.roster/1 — on the race board: the drivers and kart bodies there are,
// with the build each gives (a driver's for its weight class; a pair's is
// the two multiplied).
message Roster {
  repeated RosterDriver drivers = 1;
  repeated RosterKart karts = 2;
}

message RosterDriver {
  string id = 1;
  string name = 2;
  // light, medium or heavy.
  string class = 3;
  uint32 color = 4;
  string about = 5;
  Build build = 6;
}

message RosterKart {
  string id = 1;
  string name = 2;
  string about = 3;
  Build build = 4;
}

enum Item {
  ITEM_NONE = 0;
  // A long boost.
  ITEM_NITRO = 1;
  // Thrown ahead: it rolls, bounces off the barriers and spins the first
  // kart it meets.
  ITEM_TYRE = 2;
  // Dropped behind: slows and knocks the kart that hits it.
  ITEM_CONE = 3;
  // A patch left behind: a kart that drives into it spins.
  ITEM_OIL = 4;
  // A rocket behind the seat: faster than a nitro, and longer.
  ITEM_ROCKET = 5;
  // A canister that pours coloured smoke behind the kart: a screen.
  ITEM_SMOKE = 6;
  // Added with D-052. Three tyres, thrown one press each.
  ITEM_STACK = 7;
  // Flies over the track to the leader and comes down on it.
  ITEM_DRONE = 8;
  // An air bag that knocks every kart within a few metres aside.
  ITEM_BUMPER = 9;
  // A pit-crew push: a boost, and for a while nothing on the track touches
  // the kart.
  ITEM_PUSH = 10;
}

// kart.paddock/1 — crates to pick items from, and what karts left on the
// track. Sent when it changes: every step while a tyre rolls.
message Paddock {
  repeated Crate crates = 1;
  repeated Thing things = 2;
}

message Crate {
  float x = 1;
  float z = 2;
  // Broken, it is back in a few seconds.
  bool standing = 3;
}

message Thing {
  Item kind = 1;
  float x = 2;
  float z = 3;
  // Velocity, m/s: a tyre rolls.
  float vx = 4;
  float vz = 5;
  // Seconds before it goes.
  float life = 6;
  // Height above the road, m: a drone flies (D-052).
  float height = 7;
}

// kart.track/1 — the circuit: centre line, road and walls.
message Track {
  // x0, z0, x1, z1, …: a closed loop, metres.
  repeated float points = 1;
  float half_width = 2;
  // Grass between the road and the walls, metres.
  float verge = 3;
  // Distance along the centre line where the start/finish line is.
  float start = 4;
  // Sectors a lap is cut into; a lap counts only through all of them, in order.
  uint32 sectors = 5;
  // Crests across the road, verges and barriers (D-051): taken fast, a kart
  // leaves the road near the top and lands further on.
  repeated Crest crests = 6;
  // Which track it is (D-056): an id, a name and a line about it.
  string id = 7;
  string name = 8;
  string about = 9;
  // The sky it is raced under (noon, evening) and what surrounds it
  // (meadow, coast, forest, town): how clients dress it.
  string sky = 10;
  string scenery = 11;
  // Added with D-077. The road's height at each point of `points`, metres:
  // hills (a kart is slower uphill, faster downhill). Empty: a level road.
  repeated float heights = 12;
  // Bridges and tunnels along the road: scenery, the driving is the same.
  repeated Span spans = 13;
}

// A bridge or a tunnel (D-077): from `along` metres along the centre line,
// for `length` metres.
message Span {
  SpanKind kind = 1;
  float along = 2;
  float length = 3;
}

enum SpanKind {
  SPAN_KIND_UNSPECIFIED = 0;
  SPAN_KIND_BRIDGE = 1;
  SPAN_KIND_TUNNEL = 2;
}

message Crest {
  // Where it starts, metres along the centre line. Over `rise` metres the
  // ground rises to `height`, then over `fall` metres it comes down again,
  // each way half a cosine.
  float along = 1;
  float rise = 2;
  float height = 3;
  float fall = 4;
}

// kart.race/1 — the race in progress.
message Race {
  Phase phase = 1;
  // Server time (microseconds since the Unix epoch) when the phase ends;
  // 0 if it has no set end.
  uint64 phase_ends_us = 2;
  uint32 laps = 3;
  // Server time of the start, once racing.
  uint64 started_us = 4;
  // Kart entities in race order.
  repeated uint64 order = 5;
  // The kart of the host: the first human driver still here, who starts
  // each race (RACE_CALL_START); 0 when the world starts races by itself.
  uint64 host = 6;
  // The cup being raced (D-057); none when races follow one another on one
  // track.
  Cup cup = 7;
  // What the host has chosen to race next, and what the others would like
  // (Choice.event): "cup:ID" or "track:ID".
  string event = 8;
  repeated Vote votes = 9;
  // The events there are to choose from, as Choice.event names them.
  repeated string events = 10;
  // The port on the world's machine where its host shares their music
  // (osage-music's share: GET /music/now, /music/list, /music/track/N);
  // 0 when nothing is shared.
  uint32 music_port = 11;
  // The port on the world's machine of its voice relay (osage-voice: UDP),
  // where the players talk to one another; 0 when there is none.
  uint32 voice_port = 12;
  // Added with D-062. A time trial (the event `trial:TRACK`): every driver
  // alone against the clock — no bots, no crates, karts pass through one
  // another — with the ghosts of the best runs kept on this track.
  bool trial = 13;
  // Added with D-065. A battle (the event `battle:ARENA`): every kart has
  // three lives, each thing that hits it — or a bumper — takes one; the
  // last kart in wins, or the one with most lives when time is up. While
  // racing, phase_ends_us is when time is up.
  bool battle = 14;
  // Added with D-068. The race is run in the rain: the road grips and
  // brakes less (osage-kart-physics' Track.wet = 1). A client predicting
  // its kart steps it on a wet road.
  bool rain = 15;
  // Added with D-085. The race is run at night, under floodlights along
  // the track: only how it looks; the driving is the same.
  bool night = 16;
  // Added with D-088. How the bots race: "easy", "normal" or "hard".
  string bots = 17;
  // Added with D-089. The engine class, cc (50, 100, 150, 200): every top
  // speed and acceleration times cc/150, 200 cc times 1.15
  // (osage-kart-physics' Track.class). A client predicting its kart steps
  // it in that class.
  uint32 class = 18;
}

message Cup {
  string id = 1;
  string name = 2;
  // The track ids, in the order they are raced.
  repeated string tracks = 3;
  // The race being run or lined up, from 1; races + 1 once the cup is over.
  uint32 race = 4;
  // Points for first, second, …
  repeated uint32 points = 5;
  // Standings after the races run so far, first first.
  repeated Standing standings = 6;
}

message Standing {
  string name = 1;
  bool bot = 2;
  uint32 points = 3;
  // Place in each race run (1 the winner), 0 for a race the driver missed.
  repeated uint32 places = 4;
}

message Vote {
  string event = 1;
  uint32 drivers = 2;
}

// kart.records/1 — the world's records on this track (D-053): the best
// laps and the best races of the world's number of laps, one per driver
// name, fastest first. Kept by the world across restarts.
// Added with D-091. Every track's records the world keeps, each as
// kart.records/1 has the current one's (races and trials of the current
// number of laps): the world's leaderboard.
message Leaderboard {
  repeated Records tracks = 1;
}

message Records {
  string track = 1;
  repeated Record laps = 2;
  repeated Record races = 3;
  // The laps of the races the race board keeps.
  uint32 race_laps = 4;
  // Added with D-062. The best time trials of race_laps laps.
  repeated Record trials = 5;
}

message Record {
  string name = 1;
  uint32 ms = 2;
  // When, seconds since the Unix epoch.
  uint64 at = 3;
  // The kart and the driver character, empty until there is a choice.
  string kart = 4;
  string driver = 5;
  // Set in the race just run (or running): show it as new.
  bool fresh = 6;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  // No driver connected.
  PHASE_WAITING = 1;
  // Lights: karts on the grid, frozen.
  PHASE_COUNTDOWN = 2;
  PHASE_RACING = 3;
  // Results; the next race follows.
  PHASE_FINISHED = 4;
  // Karts on the grid, frozen, until the host starts the race: time for
  // others to join.
  PHASE_READY = 5;
}
