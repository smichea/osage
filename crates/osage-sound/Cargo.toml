[package]
name = "osage-sound"
description = "Sound placed in an object tree and carried to a listener's two ears: delay, distance, air, edges and reflecting surfaces, at what a device can afford; a scene rendered offline or played live"
license-file = "../../LICENSE-EXCEPTIONS.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
osage-sound-voices.workspace = true
osage-sound-analysis.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
# The object format's reader, for a scene's meshes (objects).
osage-objects = { workspace = true, features = ["profile"] }
gltf = { version = "1.4.1", default-features = false, features = ["extras", "names", "utils"] }
# The live engine as a Bevy audio source (live::bevy).
bevy = { workspace = true, features = ["bevy_asset", "bevy_audio"], optional = true }

[dev-dependencies]
# A contact heard where and when the physics reports it (tests/objects.rs).
osage-dynamics.workspace = true

[features]
bevy = ["dep:bevy"]
