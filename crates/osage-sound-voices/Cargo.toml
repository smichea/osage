[package]
name = "osage-sound-voices"
description = "Voices synthesised sample by sample from the state of what makes them: a river, cars and a scooter, a rubber-tyred metro and its viaduct, footsteps, contacts, the city far off"
license-file = "../../LICENSE-EXCEPTIONS.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
