[package]
name = "osage-agent"
description = "MCP adapter letting any AI agent join an osage world"
license = "MIT OR Apache-2.0"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "osage-agent-mcp"
path = "src/main.rs"

[dependencies]
osage-sdk.workspace = true
anyhow.workspace = true
prost.workspace = true
prost-reflect.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }

[dev-dependencies]
osage-credentials.workspace = true
osage-server = { path = "../osage-server" }
