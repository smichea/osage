# Asset manifest (design/03 §5): every content file osage uses that is not
# generated by its own code. The files stay out of git:
#
#   python3 tools/fetch-assets.py
#
# downloads those with a `url` and checks every file present against its
# `sha256`; those marked `manual` are downloaded by a person, as their
# publisher asks. The game runs without any of them, in procedural form.
#
# Only content under a free licence with a known author and source enters
# here (CC0 preferred). Nothing taken from commercial games (CONTRIBUTING,
# "Clean sources").

# Poly Haven — https://polyhaven.com, CC0, fetched through its public API
# (https://api.polyhaven.com/files/<id>) with a User-Agent naming osage.

