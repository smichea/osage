# Asset manifest (design/03 §5): every content file osage downloads or ships
# that is not generated by its own code. Large binaries stay out of git; they
# are fetched from `url` and checked against `sha256`.
#
# Only content under a free licence with a known author and source enters
# here (CC0 preferred: Poly Haven, ambientCG, Kenney). Nothing taken from
# commercial games (CONTRIBUTING, "Clean sources").
#
# One table per file:
#
# [[asset]]
# path = "assets/textures/asphalt_02_diff_2k.ktx2"   # where it is used from
# url = "https://…"                                   # where it comes from
# sha256 = "…"
# licence = "CC0-1.0"                                 # SPDX identifier
# author = "…"
# used_by = "worlds/kart/native: road surface (R6)"
