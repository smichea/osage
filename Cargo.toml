[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/smichea/osage"

[workspace.dependencies]
osage-proto = { path = "crates/osage-proto" }
osage-sdk = { path = "crates/osage-sdk" }
osage-credentials = { path = "crates/osage-credentials" }
osage-server = { path = "crates/osage-server" }
anyhow = "1.0.104"
base64ct = { version = "1.8.3", features = ["alloc"] }
bevy = { version = "0.20.1", default-features = false }
crossbeam-channel = "0.5.17"
futures-util = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdsa"] }
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
prost-build = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wtransport = "0.7.2"
