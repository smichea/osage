[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/smichea/osage"

[workspace.dependencies]
osage-proto = { path = "crates/osage-proto" }
osage-sdk = { path = "crates/osage-sdk" }
osage-credentials = { path = "crates/osage-credentials" }
anyhow = "1.0.104"
bevy = { version = "0.20.1", default-features = false }
crossbeam-channel = "0.5.17"
futures-util = "0.3.34"
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
prost-build = "0.14.4"
protox = "0.10.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
