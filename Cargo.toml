[workspace]
resolver = "3"
members = ["crates/*", "worlds/kart/physics", "worlds/kart/world", "worlds/kart/server", "worlds/kart/native", "worlds/kart/components/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/smichea/osage"

[workspace.dependencies]
osage-proto = { path = "crates/osage-proto" }
osage-sdk = { path = "crates/osage-sdk" }
osage-credentials = { path = "crates/osage-credentials" }
osage-server = { path = "crates/osage-server" }
osage-kart-physics = { path = "worlds/kart/physics" }
osage-world-kart = { path = "worlds/kart/world" }
osage-kart-land = { path = "worlds/kart/components/land" }
osage-kart-roadside = { path = "worlds/kart/components/roadside" }
osage-kart-model = { path = "worlds/kart/components/kart-model" }
osage-kart-crowd = { path = "worlds/kart/components/crowd" }
osage-kart-racecraft = { path = "worlds/kart/components/racecraft" }
osage-kart-sound = { path = "worlds/kart/components/sound" }
osage-kart-items = { path = "worlds/kart/components/items" }
osage-kart-records = { path = "worlds/kart/components/records" }
osage-kart-roster = { path = "worlds/kart/components/roster" }
osage-render = { path = "crates/osage-render" }
osage-update = { path = "crates/osage-update" }
osage-world-module-api = { path = "crates/osage-world-module-api" }
osage-region-link = { path = "crates/osage-region-link" }
osage-procedural = { path = "crates/osage-procedural" }
osage-content = { path = "crates/osage-content" }
osage-props = { path = "crates/osage-props" }
anyhow = "1.0.104"
base64ct = { version = "1.8.3", features = ["alloc"] }
bevy = { version = "0.20.1", default-features = false }
crossbeam-channel = "0.5.17"
futures-util = "0.3.34"
getrandom = "0.4.3"
half = "2.7.1"
hmac = "0.13.0"
libm = "0.2.16"
lewton = "0.10.2"
p256 = { version = "0.14.0", features = ["ecdsa"] }
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
prost-build = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wtransport = "0.7.2"
zune-jpeg = "0.4"

# Dependencies (Bevy above all) are optimised even in development builds: a
# 60 Hz region needs it, while osage's own crates stay quick to build and debug.
[profile.dev.package."*"]
opt-level = 2
