# SPDX-FileCopyrightText: The osage contributors
# SPDX-License-Identifier: CC-BY-SA-4.0
version = 1

# Documentation: research, design notes, decision log, knowledge bundle, README, guides
[[annotations]]
path = ["research/**", "design/**", "knowledge/**", "bench/**", "site/**", "README.md", "worlds/kart/release/windows/README.txt", "worlds/kart/release/macos/README.txt", "CONTRIBUTING.md", "AGENTS.md", "CLAUDE.md", "LICENSE-EXCEPTIONS.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The osage contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Repository tooling (CI workflows, licence policy)
[[annotations]]
path = [".github/**", "deny.toml", "Cargo.lock", ".gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The osage contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Protocol specification text
[[annotations]]
path = ["spec/**.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The osage contributors"
SPDX-License-Identifier = "Community-Spec-1.0"

# JavaScript workspace and package configuration
[[annotations]]
path = ["package.json", "package-lock.json", "packages/client-three/package.json", "packages/client-three/tsconfig.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The osage contributors"
SPDX-License-Identifier = "LicenseRef-osage-AGPL-3.0-or-later-with-exceptions"

[[annotations]]
path = ["packages/sdk-ts/package.json", "packages/sdk-ts/tsconfig.json", "packages/sdk-ts/buf.gen.yaml", "packages/sdk-ts/.gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The osage contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The kart world: an example game, permissive like the SDKs (D-031)
[[annotations]]
path = ["worlds/kart/client/package.json", "worlds/kart/client/tsconfig.json", "worlds/kart/client/buf.gen.yaml", "worlds/kart/client/.gitignore", "worlds/kart/physics/tests/golden.txt", "worlds/kart/physics/tests/golden-contacts.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The osage contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The crash relay's process file, which takes no comment (D-073)
[[annotations]]
path = ["tools/crash-relay/Procfile"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The osage contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"
