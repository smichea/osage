# Builds the kart game for Windows and attaches it to a GitHub release:
# kart-native.exe (the game), kart-server.exe (the world), play.bat (race
# the bots), host.bat and join.bat (race on the same network) and a README.
# The content (textures, sound clips) is attached to the release
# separately, from a machine that has it.
name: release-windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the build to
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 — kart game and world
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p osage-kart-native -p osage-kart-server
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/osage-kart
          cp target/release/kart-native.exe target/release/kart-server.exe dist/osage-kart/
          cp worlds/kart/release/windows/*.bat worlds/kart/release/windows/README.txt dist/osage-kart/
          cp -r LICENSE LICENSE-EXCEPTIONS.md LICENSES dist/osage-kart/
          cd dist && 7z a -tzip osage-kart-windows-x64.zip osage-kart
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/osage-kart-windows-x64.zip --clobber
