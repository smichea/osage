# Builds the kart game for Windows and attaches it to a GitHub release:
# kart-native.exe (the game), kart-server.exe (the world), play.bat (race
# the bots), host.bat and join.bat (race on the same network), kart-web.exe
# and the browser client (phones and tablets on that network) and a README.
# The content (textures, sound clips) is attached to the release
# separately, from a machine that has it.
name: release-windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the build to
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The C runtime inside the programs: nothing to install on the player's PC
  # (no Visual C++ Redistributable).
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  windows:
    name: Windows x64 — kart game and world
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The browser client runs the world's physics compiled to WebAssembly.
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # With the traced light (D-093): T4 on an RTX card, with --tier T4.
      - run: cargo build --release -p osage-kart-native -p osage-kart-server --features osage-kart-native/raytracing
      # The browser client, for phones and tablets on the host's network (kart-web).
      - run: npm ci
      - run: npm run build -w @osage/sdk
      - run: npm run build -w @osage/kart-client
      # Microsoft's DirectX shader compiler beside the game: without it, Direct3D
      # 12 falls back to the old compiler (FXC), which cannot compile the
      # renderer's shaders, and the scene stays black. Pinned and checked.
      - name: DirectX shader compiler
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DXC_TAG: v1.9.2609
          DXC_ZIP: dxc_2026_09_29.zip
          DXC_SHA256: ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1
        run: |
          gh release download "$DXC_TAG" -R microsoft/DirectXShaderCompiler -p "$DXC_ZIP" -D dxc
          echo "$DXC_SHA256  dxc/$DXC_ZIP" | sha256sum -c -
          7z x -odxc/x "dxc/$DXC_ZIP" > /dev/null
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/osage-kart/LICENSES/directx-shader-compiler
          cp dxc/x/bin/x64/dxcompiler.dll dxc/x/bin/x64/dxil.dll dist/osage-kart/
          find dxc/x -maxdepth 2 -iname 'LICENSE*' -exec cp {} dist/osage-kart/LICENSES/directx-shader-compiler/ \;
          cp target/release/kart-native.exe target/release/kart-server.exe target/release/kart-web.exe target/release/kart-update.exe dist/osage-kart/
          # What the folder holds, for kart-update.exe.
          printf '# What this folder holds, for its updater.\ncommit = %s\ntag = %s\n' "$(git rev-parse HEAD)" "$TAG" > dist/osage-kart/release.txt
          cp -r worlds/kart/client/dist dist/osage-kart/web
          cp worlds/kart/release/windows/*.bat worlds/kart/release/windows/README.txt dist/osage-kart/
          cp -r LICENSE LICENSE-EXCEPTIONS.md LICENSES dist/osage-kart/
          cd dist && 7z a -tzip osage-kart-windows-x64.zip osage-kart
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/osage-kart-windows-x64.zip --clobber
