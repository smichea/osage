name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — server, SDK, protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy -p osage-proto -p osage-sdk -p osage-credentials -p osage-server -p osage-agent -p osage-bridge -p osage-kart-physics -p osage-world-kart --all-targets -- -D warnings
      - run: cargo test -p osage-proto -p osage-sdk -p osage-credentials -p osage-server -p osage-agent -p osage-bridge -p osage-kart-physics -p osage-world-kart
      - run: cargo clippy --locked -p osage-objects -p osage-dynamics --all-features --all-targets -- -D warnings
      - run: cargo test --locked -p osage-objects -p osage-dynamics --all-features

  sound:
    name: Rust — sound engine, its voices and its oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy -p osage-sound -p osage-sound-voices -p osage-sound-analysis -p osage-sound-web -p paris-soundscape --all-targets -- -D warnings
      # The physics of the ways, the voices, the analyser, what the brief asks of the bridge, and the engine
      # played live giving the samples of an offline render.
      - run: cargo test -p osage-sound -p osage-sound-voices -p osage-sound-analysis -p osage-sound-web -p paris-soundscape
      # The engine in a browser's AudioWorklet gives the same samples as the same module called directly
      # (the runner has Chrome).
      - run: cargo build --release --target wasm32-unknown-unknown -p osage-sound-web
      - run: python3 tools/paris-soundscape/web/live.py check --quality medium

  native-client:
    name: Rust — native Bevy clients and rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev nasm
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy -p osage-client -p osage-render -p osage-kart-native --all-targets -- -D warnings
      # The live sound engine as a Bevy audio source.
      - run: cargo clippy -p osage-sound --features bevy --all-targets -- -D warnings
      # Unoptimised dependencies here: the tests are light and Bevy builds much faster.
      - run: cargo test -p osage-kart-native --config 'profile.dev.package."*".opt-level=0'

  knowledge:
    name: Knowledge bundle — OKF and the osage profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - run: python3 tools/check-knowledge.py

  typescript:
    name: TypeScript — SDK, three.js and kart clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The kart client runs the world's physics compiled to WebAssembly.
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - run: npm run build
      - run: npm test
