name: cloud-bench

# The render bench on a cloud GPU (D-042): tiers T3 and T4 on an NVIDIA L4 in
# Google Cloud. It starts when a push to main changes what can be drawn, by
# hand, and once a night to catch up; it benches only if something drawn
# changed since the last benched commit, and never twice within an hour
# (D-043). Merged code only, never pull requests (D-041). Forks without the
# OSAGE_BENCH_* repository variables skip it; tools/cloud-bench/setup.sh makes
# a project that provides them.

on:
  push:
    branches: [main]
    paths:
      - "crates/osage-render/**"
      - "crates/osage-content/**"
      - "crates/osage-procedural/**"
      - "crates/osage-props/**"
      - "worlds/kart/components/**"
      - "worlds/kart/native/**"
      - "worlds/kart/physics/**"
      - "worlds/kart/world/**"
      - "assets/manifest.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/attest-bench.py"
      - "tools/cloud-bench/**"
      - ".github/workflows/cloud-bench.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tiers:
        description: Tiers to bench, separated by spaces
        default: T3 T4
      always:
        description: Bench even if nothing drawn changed (still not twice within an hour)
        type: boolean
        default: false
      now:
        description: The maintainer asks for it now, within the hour if need be
        type: boolean
        default: false

permissions:
  contents: read

# One GPU: one run at a time, none cancelled half way (its machine is paid for).
concurrency:
  group: cloud-bench
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TIERS: ${{ inputs.tiers || 'T3 T4' }}
  # The paths above, for the comparison with the last benched commit.
  DRAWN: >-
    crates/osage-render crates/osage-content crates/osage-procedural crates/osage-props
    worlds/kart/components worlds/kart/native worlds/kart/physics worlds/kart/world
    assets/manifest.toml Cargo.toml Cargo.lock tools/attest-bench.py tools/cloud-bench
    .github/workflows/cloud-bench.yml

jobs:
  changes:
    name: Anything to bench?
    if: vars.OSAGE_BENCH_PROJECT != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      bench: ${{ steps.decide.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A bench leaves its receipts as an artefact: the newest says which
      # commit was benched last, and when. A commit over budget is not
      # benched again; one whose machine never started is.
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          ALWAYS: ${{ inputs.always || false }}
          NOW: ${{ inputs.now || false }}
        run: |
          read -r last when < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bench-receipts&per_page=1" \
            --jq '.artifacts[0] // empty | "\(.workflow_run.head_sha) \(.created_at)"' 2>/dev/null) || true
          age=$(( $(date +%s) - $(date -d "${when:-1970-01-01}" +%s) ))
          if [ "$NOW" = true ]; then
            echo "benching now by request"; bench=true
          elif [ "$age" -lt 3600 ]; then
            echo "benched $((age / 60)) minutes ago: not twice within an hour"; bench=false
          elif [ "$ALWAYS" = true ]; then
            echo "benching by request"; bench=true
          elif [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            echo "no benched commit to compare with"; bench=true
          elif git diff --quiet "$last" HEAD -- $DRAWN; then
            echo "nothing drawn changed since $last"; bench=false
          else
            echo "changed since $last:"; git diff --stat "$last" HEAD -- $DRAWN | tail -5; bench=true
          fi
          echo "bench=$bench" >> "$GITHUB_OUTPUT"

  build:
    name: Build the bench
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cloud-bench
      # The manifest's content, fetched once and kept while the manifest is unchanged.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: assets/polyhaven
          key: assets-${{ hashFiles('assets/manifest.toml') }}
      - run: python3 tools/fetch-assets.py
      # The receipt names the commit it measured; the bench machine has no checkout to ask.
      - run: OSAGE_COMMIT=$(git rev-parse --short HEAD) cargo build --release -p osage-kart-native --no-default-features --features raytracing
      - run: |
          mkdir -p kart/assets
          cp target/release/kart-native kart/
          strip kart/kart-native
          cp -r assets/manifest.toml assets/polyhaven kart/assets/
          tar czf kart.tar.gz kart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kart-build
          path: kart.tar.gz
          retention-days: 3

  bench:
    name: Bench on an NVIDIA L4
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kart-build
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.OSAGE_BENCH_PROVIDER }}
          service_account: ${{ vars.OSAGE_BENCH_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: bash tools/cloud-bench/bench.sh "${{ vars.OSAGE_BENCH_PROJECT }}" kart.tar.gz out $TIERS
      - name: Attest
        run: |
          status=0
          {
            echo "## Render bench, $(git rev-parse --short HEAD)"
            echo
            python3 tools/cloud-bench/summary.py out $TIERS || status=$?
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-receipts
          path: out
          if-no-files-found: ignore
