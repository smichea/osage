[package]
name = "osage-paris-voices"
description = "The voices of a Paris bridge, synthesised sample by sample from their state: the Seine, cars and a scooter, a rubber-tyred metro and the viaduct under it, footsteps, the city far off"
license-file = "../../../LICENSE-EXCEPTIONS.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# The kart's two-stroke, for a scooter: its card says "any small
# single-cylinder engine".
osage-kart-sound = { path = "../../../worlds/kart/components/sound" }
