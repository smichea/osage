# A check of its own, outside the repository's workspace: it needs the
# engine's reader of the object format (crates/osage-objects), which the
# sound itself does not, and builds only where that crate is.
#
#     cargo test --manifest-path tools/paris-soundscape/object-check/Cargo.toml
[workspace]

[package]
name = "osage-paris-soundscape-object-check"
description = "The scene of the bridge loads in the engine's own reader of the object format"
license-file = "../../../LICENSE-EXCEPTIONS.md"
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dev-dependencies]
paris-soundscape = { path = ".." }
osage-objects = { path = "../../../crates/osage-objects", features = ["profile"] }
gltf = { version = "1.4.1", default-features = false, features = ["extras", "names"] }
