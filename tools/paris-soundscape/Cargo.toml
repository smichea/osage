# The command that renders, checks and measures a scene with the engine's
# sound (osage-sound), and the scene it comes with: the Pont de Bir-Hakeim.
[package]
name = "paris-soundscape"
description = "The Pont de Bir-Hakeim heard for 45 seconds with osage-sound, rendered offline; render, verify, measure and bench any scene"
license-file = "../../LICENSE-EXCEPTIONS.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "paris-soundscape"
path = "src/main.rs"

[dependencies]
osage-sound.workspace = true
osage-sound-voices.workspace = true
osage-sound-analysis.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The scene of the bridge in the engine's own reader of the object format.
osage-objects = { workspace = true, features = ["profile"] }
gltf = { version = "1.4.1", default-features = false, features = ["extras", "names"] }
